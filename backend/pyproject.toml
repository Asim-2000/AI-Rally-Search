[project]
name = "ai-rally-search-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncmy>=0.2.9,<1",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "live_db: requires configured live MySQL access",
  "parity: compares canonical IDs across implementations",
]
testpaths = ["tests"]
pythonpath = ["."]
