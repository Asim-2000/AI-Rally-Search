[project]
name = "ai-rally-search-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncmy>=0.2.9,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "unit: hermetic fast unit tests",
  "live_db: requires configured live MySQL access",
  "benchmark: frozen entity search benchmarks",
  "parity: compares canonical IDs across implementations",
  "provider_contract: hermetic provider adapter contract tests",
  "live_provider: opt-in tests requiring provider credentials",
  "live_openai: opt-in tests requiring OpenAI credentials",
  "query_understanding: single-turn query-understanding tests",
  "e2e_live_db: opt-in natural-language through live database tests",
  "voice: Python voice/STT migration tests",
  "live_stt: opt-in tests requiring OpenAI transcription credentials",
]
testpaths = ["tests"]
pythonpath = ["."]
